<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Toki</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <img src="icon.png" alt="" width="28" height="28" />
    <strong>Toki</strong>
    <div class="seg" role="radiogroup" aria-label="Tipo de dado">
      <button type="button" role="radio" data-rule="Válido" aria-checked="true">Válido</button>
      <button type="button" role="radio" data-rule="Inválido" aria-checked="false">Inválido</button>
    </div>
  </header>

  <main id="home">
    <section class="forms" aria-label="Formulário">
      <button type="button" class="wide" data-action="fill">
        <svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z M14 4v5h5 M8 13h8 M8 17h5" /></svg>
        <span><b>Preencher formulário</b><small>Escolha o bloco e preenche tudo</small></span>
      </button>
      <button type="button" class="wide" data-action="capture">
        <svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3 M16 4h3a1 1 0 0 1 1 1v3 M20 16v3a1 1 0 0 1-1 1h-3 M8 20H5a1 1 0 0 1-1-1v-3 M8 10h8 M8 14h5" /></svg>
        <span><b>Capturar para a massa</b><small>Leva as colunas ao Toki</small></span>
      </button>
    </section>

    <p class="target" id="target" role="status"><i></i><span id="target-text">Procurando o campo selecionado…</span></p>
    <p class="label" id="tools-label">Inserir no campo selecionado</p>
    <section class="grid" aria-labelledby="tools-label">
      <button type="button" data-person>
        <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5" /></svg>Pessoa
      </button>
      <button type="button" data-type="CPF">
        <svg viewBox="0 0 24 24"><path d="M3 6h18v12H3z M7 10.5a1.5 1.5 0 1 0 3 0 1.5 1.5 0 0 0-3 0 M6 15c.5-1.3 1.5-2 2.5-2s2 .7 2.5 2 M14 10h4 M14 14h3" /></svg>CPF
      </button>
      <button type="button" data-type="CNPJ">
        <svg viewBox="0 0 24 24"><path d="M4 20V6l7-3v17 M11 9h9v11 M2 20h20 M7 8v.01 M7 12v.01 M7 16v.01 M15 13h1 M15 16h1" /></svg>CNPJ
      </button>
      <button type="button" data-type="E-mail">
        <svg viewBox="0 0 24 24"><path d="M3 6h18v12H3z M3 7l9 6 9-6" /></svg>E-mail
      </button>
      <button type="button" data-type="Telefone">
        <svg viewBox="0 0 24 24"><path d="M8 3h8a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z M11 18h2" /></svg>Telefone
      </button>
      <button type="button" data-type="CEP">
        <svg viewBox="0 0 24 24"><path d="M12 21s-6-5.4-6-11a6 6 0 1 1 12 0c0 5.6-6 11-6 11z M12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" /></svg>CEP
      </button>
      <button type="button" data-type="Endereço">
        <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7 M6 9.5V20h12V9.5 M10 20v-5h4v5" /></svg>Endereço
      </button>
      <button type="button" data-type="Data">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v14H4z M4 10h16 M8 3v4 M16 3v4 M8 14h2 M14 14h2" /></svg>Data
      </button>
      <button type="button" data-type="Cartão">
        <svg viewBox="0 0 24 24"><path d="M3 6h18v12H3z M3 10h18 M7 15h3" /></svg>Cartão
      </button>
      <button type="button" data-type="Chave PIX">
        <svg viewBox="0 0 24 24"><path d="M12 3l9 9-9 9-9-9z M8.5 12h7 M12 8.5v7" /></svg>PIX
      </button>
      <button type="button" data-type="UUID">
        <svg viewBox="0 0 24 24"><path d="M9 4L7 20 M17 4l-2 16 M4 9h16 M3 15h16" /></svg>UUID
      </button>
      <button type="button" data-more>
        <svg viewBox="0 0 24 24"><path d="M5 5h4v4H5z M15 5h4v4h-4z M5 15h4v4H5z M15 15h4v4h-4z" /></svg>Mais
      </button>
    </section>
  </main>

  <main id="person" hidden>
    <div class="subhead">
      <button type="button" class="back" data-back aria-label="Voltar">‹</button>
      <b>Pessoa coerente</b>
      <button type="button" class="link" data-person>Outra</button>
    </div>
    <p class="label">Mesma pessoa em todos os dados. Clique para inserir e copiar.</p>
    <ul id="person-list" class="list"></ul>
  </main>

  <main id="more" hidden>
    <div class="subhead">
      <button type="button" class="back" data-back aria-label="Voltar">‹</button>
      <b>Todos os dados</b>
    </div>
    <input id="search" type="search" placeholder="Buscar: cor, decimal, SKU…" aria-label="Buscar tipo de dado" />
    <ul id="types" class="list"></ul>
  </main>

  <section id="result" class="result" hidden aria-live="polite">
    <div class="result-head"><small id="result-type"></small><small id="result-note"></small></div>
    <code id="result-value"></code>
    <div class="result-actions">
      <button type="button" id="again">Gerar outro</button>
      <button type="button" id="copy">Copiar</button>
    </div>
  </section>

  <footer>
    <button type="button" class="link" id="open-toki">Abrir o Toki</button>
    <button type="button" class="link" id="resend">Reenviar captura</button>
    <details>
      <summary aria-label="Configurações">⚙</summary>
      <label for="url">Endereço do Toki</label>
      <input id="url" type="url" placeholder="http://localhost:5173/" />
    </details>
  </footer>
  <script src="engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
